<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YUCOM 通用串口测试工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f5;
      --panel: #ffffff;
      --line: #cbd4da;
      --line-dark: #aeb9c1;
      --text: #183028;
      --muted: #63726d;
      --green: #17683f;
      --green-2: #238650;
      --green-soft: #e6f3eb;
      --amber: #b86a00;
      --red: #b63e39;
      --shadow: 0 8px 30px rgba(20, 48, 38, .08);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); overflow: hidden; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app { height: 100vh; display: grid; grid-template-rows: 54px 1fr 28px; min-width: 980px; }
    .topbar {
      display: flex; align-items: center; gap: 14px; padding: 0 18px;
      background: #f8faf9; border-bottom: 1px solid var(--line); box-shadow: 0 2px 8px rgba(20,48,38,.05);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 300px; }
    .brand-icon {
      width: 32px; height: 32px; display: grid; place-items: center; color: white; font-weight: 800;
      background: linear-gradient(145deg, var(--green-2), var(--green)); border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
    }
    .brand-title { font-size: 18px; font-weight: 750; letter-spacing: .2px; }
    .brand-subtitle { color: var(--muted); font-size: 12px; margin-left: 5px; }
    .top-spacer { flex: 1; }
    .connection-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px;
      border: 1px solid var(--line); border-radius: 999px; background: white; color: var(--muted); font-size: 13px;
    }
    .connection-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #99a5a0; }
    .connection-pill.online { color: var(--green); border-color: #a8d1b9; background: var(--green-soft); }
    .connection-pill.online .dot { background: #22a05b; box-shadow: 0 0 0 3px rgba(34,160,91,.13); }
    .icon-button { border: 1px solid var(--line); background: white; border-radius: 6px; padding: 7px 12px; color: var(--text); }
    .icon-button:hover { background: #f1f5f3; }
    .exit-button { color: var(--red); }

    .workspace { min-height: 0; display: grid; grid-template-columns: 330px 1fr; gap: 12px; padding: 12px; }
    .sidebar, .content { min-height: 0; }
    .sidebar { display: flex; flex-direction: column; gap: 10px; overflow: auto; padding-right: 2px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .card-title {
      height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
      border-bottom: 1px solid #dce3df; color: var(--green); font-size: 15px; font-weight: 700;
    }
    .card-body { padding: 11px 12px; }
    .form-grid { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 9px 8px; }
    .form-grid label { color: #42554d; font-size: 13px; }
    select, input[type="number"] {
      width: 100%; min-height: 34px; padding: 5px 8px; border: 1px solid var(--line-dark); border-radius: 5px;
      background: white; color: var(--text); outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--green-2); box-shadow: 0 0 0 2px rgba(35,134,80,.12); }
    select:disabled, input:disabled { background: #edf1ef; color: #83908a; }
    .port-row { display: grid; grid-template-columns: 1fr 38px; gap: 6px; }
    .refresh-button { border: 1px solid var(--line-dark); background: white; border-radius: 5px; font-size: 18px; color: var(--green); }
    .primary-button {
      width: 100%; min-height: 38px; border: 1px solid #125d38; border-radius: 6px; color: white;
      background: linear-gradient(#268d57, #17683f); font-weight: 700;
    }
    .primary-button:hover { filter: brightness(1.05); }
    .primary-button.close { background: linear-gradient(#c35650, #a83b36); border-color: #96332f; }
    .primary-button:disabled, .send-button:disabled, .mode-button:disabled { cursor: not-allowed; opacity: .48; }
    .open-row { margin-top: 11px; }
    .hint { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.55; }

    .mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .mode-button {
      border: 1px solid #a9beb2; background: #f7faf8; color: var(--green); border-radius: 6px;
      min-height: 48px; font-weight: 700; line-height: 1.15;
    }
    .mode-button span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 500; }
    .mode-button:hover:not(:disabled) { background: var(--green-soft); border-color: #70aa88; }
    .test-result { margin-top: 8px; min-height: 32px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 5px; background: #f8faf9; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .test-result.pass { color: #17683f; border-color: #9bc8ac; background: #eaf6ee; }
    .test-result.fail { color: #9c352f; border-color: #dfaaa6; background: #fff0ef; }
    .warning-box { margin-top: 8px; padding: 7px 8px; border-left: 3px solid var(--amber); background: #fff7e9; color: #76511b; font-size: 11px; line-height: 1.45; }

    .signal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 5px; }
    .signal { display: flex; align-items: center; gap: 6px; color: var(--muted); font: 12px ui-monospace, monospace; }
    .signal-dot { width: 11px; height: 11px; border: 1px solid #95a19c; border-radius: 3px; background: #edf1ef; }
    .signal.active .signal-dot { background: #33a765; border-color: #20834b; box-shadow: 0 0 0 2px rgba(51,167,101,.13); }

    .counter-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
    .counter-value { min-width: 110px; padding: 5px 8px; background: #f7f9f8; border: 1px solid #d9e0dc; text-align: right; font: 14px ui-monospace, monospace; }
    .secondary-button { border: 1px solid var(--line-dark); background: white; border-radius: 5px; padding: 6px 12px; color: var(--text); }
    .counter-reset { grid-column: 1 / -1; justify-self: end; margin-top: 2px; }

    .content { display: grid; grid-template-rows: minmax(260px, 1fr) minmax(210px, .47fr); gap: 12px; }
    .pane { min-height: 0; display: grid; grid-template-rows: 42px 1fr; }
    .pane-header {
      display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line); background: #f9fbfa;
      border-radius: 8px 8px 0 0;
    }
    .pane-title { color: var(--green); font-size: 16px; font-weight: 750; }
    .pane-spacer { flex: 1; }
    .check { display: inline-flex; align-items: center; gap: 5px; color: #42554d; font-size: 13px; white-space: nowrap; }
    .check input { accent-color: var(--green-2); width: 16px; height: 16px; }
    .receive-body { min-height: 0; position: relative; }
    .receive-view {
      height: 100%; overflow: auto; padding: 10px 12px; background: white; white-space: pre-wrap; overflow-wrap: anywhere;
      font: 14px/1.52 "Noto Sans Mono CJK SC", "DejaVu Sans Mono", Consolas, monospace; tab-size: 4;
    }
    .receive-view.empty::before { content: "等待串口数据…"; color: #9aa6a0; }
    .receive-view.paused::after {
      content: "显示已暂停（仍在接收并计数）"; position: sticky; bottom: 10px; float: right;
      padding: 5px 9px; border-radius: 5px; color: #745019; background: #fff2cf; border: 1px solid #e5c882;
    }
    .send-layout { min-height: 0; display: grid; grid-template-rows: 1fr 47px; }
    .send-editor {
      width: 100%; height: 100%; resize: none; border: 0; outline: 0; padding: 10px 12px; color: #15271f;
      font: 14px/1.5 "Noto Sans Mono CJK SC", "DejaVu Sans Mono", Consolas, monospace;
    }
    .send-editor:focus { box-shadow: inset 0 0 0 2px rgba(35,134,80,.15); }
    .send-toolbar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--line); background: #f9fbfa; }
    .send-toolbar select { width: 92px; min-height: 32px; }
    .send-toolbar input[type="number"] { width: 88px; min-height: 32px; }
    .send-button {
      min-width: 106px; height: 34px; border: 1px solid #125d38; color: white; background: var(--green-2); border-radius: 5px; font-weight: 700;
    }
    .send-button:hover:not(:disabled) { background: var(--green); }

    .statusbar {
      display: flex; align-items: center; gap: 10px; padding: 0 12px; border-top: 1px solid var(--line); background: #f8faf9;
      color: var(--muted); font-size: 12px;
    }
    .status-message { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .status-message.error { color: var(--red); }
    .status-message.ok { color: var(--green); }
    .status-right { font-family: ui-monospace, monospace; }
    .toast {
      position: fixed; right: 18px; bottom: 42px; z-index: 10; max-width: 480px; padding: 10px 14px; border-radius: 7px;
      color: white; background: #263a31; box-shadow: 0 8px 25px rgba(0,0,0,.2); opacity: 0; transform: translateY(10px);
      transition: .2s ease; pointer-events: none; font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #a43b36; }

    @media (max-height: 900px) {
      .workspace { padding: 8px; gap: 8px; }
      .sidebar { gap: 7px; }
      .card-body { padding: 8px 10px; }
      .card-title { height: 34px; }
      .form-grid { gap: 6px 8px; }
      .form-grid select { min-height: 30px; padding: 3px 7px; }
      .primary-button { min-height: 34px; }
      .open-row { margin-top: 7px; }
      .hint { margin-top: 5px; line-height: 1.4; }
      .content { gap: 8px; }
      .mode-button { min-height: 42px; }
    }
  </style>
  <style>
    /* YUCOM 1.2 visual system: all icons below are original inline SVG. */
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --surface: #f8fafc;
      --surface-blue: #eff6ff;
      --surface-green: #f0fdf4;
      --line: #d8e1ee;
      --line-dark: #c4d0df;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #dbeafe;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --amber: #f59e0b;
      --amber-soft: #fff7ed;
      --red: #dc2626;
      --shadow: 0 12px 34px rgba(15, 23, 42, .075);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei UI", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    }
    body {
      background:
        radial-gradient(circle at 100% 0, rgba(219, 234, 254, .52), transparent 36%),
        var(--bg);
      color: var(--text);
    }
    button { transition: border-color .16s ease, background .16s ease, box-shadow .16s ease, transform .16s ease; }
    button:active:not(:disabled) { transform: translateY(1px); }
    .app { grid-template-rows: 72px minmax(0, 1fr) 28px; min-width: 1000px; }
    .topbar {
      gap: 16px; padding: 0 24px; background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid #e2e8f0; box-shadow: none; backdrop-filter: blur(12px);
    }
    .brand { min-width: 310px; gap: 12px; }
    .brand-icon {
      width: 38px; height: 38px; padding: 3px; border-radius: 11px;
      background: linear-gradient(145deg, #2563eb, #4f46e5);
      box-shadow: 0 6px 14px rgba(37, 99, 235, .2), inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .brand-icon svg { width: 100%; height: 100%; display: block; }
    .brand-copy { display: flex; flex-direction: column; gap: 1px; }
    .brand-title { font-size: 19px; line-height: 1.15; font-weight: 780; letter-spacing: .3px; }
    .brand-subtitle { margin: 0; color: var(--muted); font-size: 11px; }
    .connection-pill {
      gap: 8px; padding: 7px 12px; border-color: #fed7aa; background: var(--amber-soft);
      color: #9a3412; font-size: 12px; font-weight: 650;
    }
    .connection-pill .dot { width: 9px; height: 9px; background: var(--amber); }
    .connection-pill.online { color: #166534; border-color: #bbf7d0; background: var(--green-soft); }
    .connection-pill.online .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(22,163,74,.12); }
    .top-action {
      min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--panel); color: #475569; font-size: 12px;
    }
    .top-action:hover { border-color: #b8c6d8; background: var(--surface); }
    .exit-button { color: #b91c1c; }
    .window-actions { display: none; align-items: center; gap: 10px; }
    .window-control {
      display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0;
      border-radius: 50%; background: #f1f5f9; color: #64748b;
    }
    .window-control:hover { background: #e2e8f0; color: #334155; }
    .window-control.close:hover { background: #fee2e2; color: #b91c1c; }
    .window-control svg { width: 16px; height: 16px; }
    body.windows-host .topbar { user-select: none; }
    body.windows-host .top-action { display: none; }
    body.windows-host .window-actions { display: flex; }
    body.windows-host { overflow: hidden; }
body.windows-host .app {
  width: 100%;
  height: calc(100vh / var(--host-zoom, 1));
  zoom: var(--host-zoom, 1);
}

    .workspace { grid-template-columns: 326px minmax(620px, 1fr); gap: 16px; padding: 16px 20px; overflow: auto; }
    .sidebar { overflow: visible; padding: 0; }
    .card { border: 1px solid rgba(216, 225, 238, .92); border-radius: 18px; box-shadow: var(--shadow); }
    .settings-card { height: 100%; min-height: 680px; overflow: hidden; }
    .panel-section { padding: 20px 22px; }

    .section-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 17px; }
    .section-heading h2 { margin: 0; color: #172033; font-size: 16px; line-height: 1.3; }
    .section-meta { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .field { display: grid; gap: 7px; margin-top: 14px; }
    .field:first-of-type { margin-top: 0; }
    .field-label { color: var(--muted); font-size: 11px; font-weight: 650; }
    .field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    }

    .refresh-button:hover { border-color: #9eb1c8; background: var(--surface); }
    .open-row { margin-top: 12px; }
    .primary-button {
      display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
      border: 0; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 7px 16px rgba(37, 99, 235, .2); color: #fff; font-weight: 700;
    }
    .primary-button:hover:not(:disabled) { filter: none; box-shadow: 0 9px 20px rgba(37,99,235,.27); }
    .primary-button.close { background: linear-gradient(135deg, #dc2626, #b91c1c); }

    .signal-grid { gap: 12px 8px; }

    .signal.active .signal-dot { background: var(--green); border: 0; box-shadow: 0 0 0 3px rgba(22,163,74,.12); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { min-height: 70px; padding: 12px 14px; border-radius: 12px; }

    .stat-label { display: block; margin-bottom: 6px; color: #52657d; font-size: 11px; }
    .stat-value { color: var(--blue); font: 700 20px/1 "Segoe UI", sans-serif; }
    .stat-card.rx .stat-value { color: var(--green); }
    .stat-unit { margin-left: 3px; font-size: 11px; font-weight: 600; }
    .counter-reset { width: 100%; min-height: 38px; margin-top: 12px; }
    .secondary-button {
      border-color: var(--line-dark); border-radius: 9px; padding: 7px 13px; background: #fff; color: #475569; font-size: 12px;
    }
    .secondary-button:hover { border-color: #9eb1c8; background: var(--surface); }

    .content { grid-template-rows: minmax(330px, 1.35fr) minmax(290px, .9fr); gap: 16px; }
    .pane { grid-template-rows: 62px minmax(0, 1fr); overflow: hidden; }
    .pane-header {
      gap: 10px; padding: 0 22px; border-bottom: 0; border-radius: 18px 18px 0 0; background: #fff;
    }
    .pane-heading { display: flex; align-items: center; gap: 10px; }
    .pane-symbol { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; }
    .pane-symbol svg { width: 20px; height: 20px; }
    .pane-symbol.rx { background: #ecfdf5; color: var(--green); }
    .pane-symbol.tx { background: var(--surface-blue); color: var(--blue); }
    .pane-title { color: #172033; font-size: 16px; font-weight: 750; }
    .direction-tag { padding: 4px 9px; border-radius: 999px; font-size: 10px; font-weight: 750; }

      position: absolute; left: 38px; bottom: 34px; z-index: 2; padding: 4px 12px;

    }

    .send-layout { grid-template-rows: minmax(92px, 1fr) auto auto; padding: 0 22px 18px; }
    .send-editor {
      border: 1px solid var(--line-dark); border-radius: 12px; padding: 16px 18px; background: var(--surface); color: #0f2748;
      font: 13px/1.55 "Noto Sans Mono CJK SC", "DejaVu Sans Mono", Consolas, monospace;
    }
    .send-editor:focus { box-shadow: 0 0 0 3px rgba(37,99,235,.09); border-color: #8fb3f4; }
    .send-toolbar { gap: 9px; padding: 10px 0; border-top: 0; background: #fff; color: #52657d; font-size: 11px; }

    }
    .mode-button span { margin-top: 2px; font-size: 9px; }
    .mode-button:hover:not(:disabled) { border-color: #9eb1c8; background: var(--surface); }
    .quick-copy { min-width: 0; text-align: right; }
    .test-result { min-height: auto; margin: 0; padding: 0; border: 0; background: transparent; color: #64748b; font-size: 10.5px; }
    .test-result.pass, .test-result.fail { border: 0; background: transparent; }
    .safety-note { margin-top: 3px; color: #94a3b8; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .statusbar { border-top-color: #dfe7f1; background: rgba(255,255,255,.9); color: #64748b; }
    .status-message.ok { color: #15803d; }
    .status-right { color: #52657d; }
    .toast { border-radius: 10px; background: #172033; }

    body.windows-host .auto-scroll-control,
    body.windows-host #clearSend,
    body.windows-host .quick-row,
    body.windows-host .hint { display: none; }
    body.windows-host .send-layout { grid-template-rows: minmax(92px, 1fr) auto; }

    @media (max-width: 1160px) {
      .workspace { grid-template-columns: 300px minmax(590px, 1fr); padding-left: 12px; padding-right: 12px; gap: 12px; }
      .panel-section { padding-left: 18px; padding-right: 18px; }
      .panel-divider { margin-left: 18px; margin-right: 18px; }
      .pane-header, .receive-body, .send-layout { padding-left: 16px; padding-right: 16px; }
      .quick-row { grid-template-columns: auto 1fr; }
    }
    @media (max-height: 820px) {
      .app { grid-template-rows: 64px minmax(0, 1fr) 26px; }
      .workspace { padding-top: 10px; padding-bottom: 10px; }
      .settings-card { min-height: 628px; }
      .panel-section { padding-top: 13px; padding-bottom: 13px; }
      .section-heading { margin-bottom: 11px; }
      .field { margin-top: 9px; gap: 4px; }
      select, input[type="number"] { min-height: 34px; padding-top: 4px; padding-bottom: 4px; }
      .primary-button { min-height: 38px; }
      .stat-card { min-height: 58px; padding-top: 9px; padding-bottom: 9px; }
      .counter-reset { min-height: 32px; margin-top: 8px; }
      .content { grid-template-rows: minmax(280px, 1.2fr) minmax(260px, .9fr); gap: 10px; }
      .pane { grid-template-rows: 52px minmax(0, 1fr); }
      .receive-body { padding-bottom: 14px; }
      .receive-meta { bottom: 26px; }
      .send-layout { padding-bottom: 10px; }
      .send-toolbar { padding: 7px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-label="YUCOM 串行飞檐标记">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5.5 11h3.5L16 5.8 23 11h3.5M5 12.6h22" stroke-width="1.45" opacity=".9"/>
              <path d="M10.2 17.2H13l4 3h4.8M10.2 21.8h11.6M10.2 26.4H13l4-3h4.8" stroke-width="1.55"/>
            </g>
            <g fill="white">
              <circle cx="8" cy="17.2" r="1.35"/><circle cx="24" cy="17.2" r="1.35"/>
              <circle cx="8" cy="21.8" r="1.35"/><circle cx="24" cy="21.8" r="1.35"/>
              <circle cx="8" cy="26.4" r="1.35"/><circle cx="24" cy="26.4" r="1.35"/>
            </g>
          </svg>
        </div>
        <div class="brand-copy">
          <span class="brand-title">YUCOM</span>
          <span class="brand-subtitle">通用串口诊断与回环测试</span>
        </div>
      </div>
      <div class="top-spacer"></div>
      <div id="connectionPill" class="connection-pill"><span class="dot"></span><span id="connectionText">未连接</span></div>
      <button id="aboutButton" class="top-action" type="button">使用提示</button>
      <button id="exitButton" class="top-action exit-button" type="button">退出程序</button>
      <div class="window-actions" aria-label="窗口控制">
        <button id="windowMinimize" class="window-control" type="button" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="windowMaximize" class="window-control" type="button" title="最大化或还原" aria-label="最大化或还原">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button id="windowClose" class="window-control close" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <section class="card settings-card">
          <div class="panel-section">
            <div class="section-heading">
              <h2>连接设置</h2>
              <span id="portGroupLabel" class="section-meta">默认 115200 · 8N1</span>
            </div>

            <div class="field">
              <label class="field-label" for="portSelect">串口设备</label>
              <div class="port-row">
                <select id="portSelect"></select>
                <button id="refreshPorts" class="refresh-button" title="重新扫描串口" type="button">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.2 8.2A6.2 6.2 0 0 1 14.6 5M14.6 5v4h-4M15.8 11.8A6.2 6.2 0 0 1 5.4 15M5.4 15v-4h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  刷新
                </button>
              </div>
            </div>

            <div class="open-row">
              <button id="openButton" class="primary-button" type="button">
                <span class="button-symbol"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4.5v3h8v-3M6 4.5V2.5M10 4.5V2.5M8 7.5v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span>连接串口</span>
              </button>
            </div>

            <div class="field">
              <label class="field-label" for="baudSelect">波特率</label>
              <select id="baudSelect">
                <option>921600</option><option>460800</option><option>230400</option><option selected>115200</option>
                <option>57600</option><option>38400</option><option>19200</option><option>9600</option>
                <option>4800</option><option>2400</option><option>1200</option><option>600</option><option>300</option>
              </select>
            </div>

            <div class="field-pair">
              <div class="field"><label class="field-label" for="dataBits">数据位</label><select id="dataBits"><option>8</option><option>7</option><option>6</option><option>5</option></select></div>
              <div class="field"><label class="field-label" for="stopBits">停止位</label><select id="stopBits"><option>1</option><option>2</option></select></div>
            </div>
            <div class="field-pair">
              <div class="field"><label class="field-label" for="paritySelect">校验方式</label><select id="paritySelect"><option value="none">无校验</option><option value="odd">奇校验</option><option value="even">偶校验</option></select></div>
              <div class="field"><label class="field-label" for="flowSelect">流量控制</label><select id="flowSelect"><option value="none">无流控</option><option value="software">软件流控</option><option value="hardware">硬件流控</option></select></div>
            </div>
            <div class="hint">仅操作当前选中的串口设备；连接后参数将暂时锁定。</div>
          </div>

          <div class="panel-divider"></div>
          <div class="panel-section compact">
            <div class="section-heading"><h2>线路信号</h2><span id="signalState" class="section-meta">等待连接</span></div>
            <div class="signal-grid">
              <div class="signal" data-signal="DTR"><span class="signal-dot"></span>DTR</div>
              <div class="signal" data-signal="DSR"><span class="signal-dot"></span>DSR</div>
              <div class="signal" data-signal="RTS"><span class="signal-dot"></span>RTS</div>
              <div class="signal" data-signal="CTS"><span class="signal-dot"></span>CTS</div>
              <div class="signal" data-signal="DCD"><span class="signal-dot"></span>DCD</div>
              <div class="signal" data-signal="RI"><span class="signal-dot"></span>RING</div>
            </div>
          </div>

          <div class="panel-divider"></div>
          <div class="panel-section compact">
            <div class="section-heading"><h2>流量统计</h2></div>
            <div class="stat-grid">
              <div class="stat-card tx"><span class="stat-label">TX · 发送</span><span id="txCount" class="stat-value">0</span><span class="stat-unit">字节</span></div>
              <div class="stat-card rx"><span class="stat-label">RX · 接收</span><span id="rxCount" class="stat-value">0</span><span class="stat-unit">字节</span></div>
            </div>
            <button id="resetCounters" class="secondary-button counter-reset" type="button">清零计数</button>
          </div>
        </section>
      </aside>

      <section class="content">
        <section class="card pane">
          <div class="pane-header">
            <div class="pane-heading">
              <span class="pane-symbol rx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span class="pane-title">接收监视器</span><span class="direction-tag rx">RX</span>
            </div>
            <div class="pane-spacer"></div>
            <label class="check"><input id="rxHex" type="checkbox">HEX 显示</label>
            <label class="check auto-scroll-control"><input id="autoScroll" type="checkbox" checked>自动滚动</label>
            <label class="check"><input id="pauseDisplay" type="checkbox">暂停显示</label>
            <button id="clearReceive" class="secondary-button" type="button">清空</button>
          </div>
          <div class="receive-body">
            <div id="receiveView" class="receive-view empty"></div>
            <div id="receiveMeta" class="receive-meta">UTF-8 · 自动滚动开启</div>
          </div>
        </section>

        <section class="card pane">
          <div class="pane-header">
            <div class="pane-heading">
              <span class="pane-symbol tx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9M7.5 13.5 12 9l4.5 4.5M5 5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span class="pane-title">发送编辑器</span><span class="direction-tag tx">TX</span>
            </div>
            <div class="pane-spacer"></div>
            <label class="check"><input id="txHex" type="checkbox">HEX 发送</label>
            <button id="clearSend" class="secondary-button" type="button">清空</button>
          </div>
          <div class="send-layout">
            <textarea id="sendEditor" class="send-editor" spellcheck="false" placeholder="输入要发送的内容；HEX 模式示例：55 AA 01 02">YUCOM serial test</textarea>
            <div class="send-toolbar">
              <span>结束符</span>
              <select id="newlineSelect"><option value="none">无结束符</option><option value="crlf">CRLF</option><option value="cr">CR</option><option value="lf">LF</option></select>
              <span>周期</span>
              <input id="intervalMs" type="number" min="50" max="3600000" value="1000">
              <span>ms</span>
              <label class="check"><input id="timedSend" type="checkbox">定时发送</label>
              <div class="pane-spacer"></div>
              <button id="testFrameButton" class="mode-button" disabled>标准测试帧</button>
              <button id="sendButton" class="send-button" type="button" disabled>发送</button>
            </div>
            <div class="quick-row">
              <button id="loopbackButton" class="mode-button" disabled>512 字节回环自检<span>TX → RX 核对</span></button>
              <div class="quick-copy">
                <div id="quickTestResult" class="test-result">就绪：打开串口后可发送测试帧或进行硬件回环自检。</div>
                <div class="safety-note">回环前请确认接口电平与接线标准一致，RS232、TTL、RS422、RS485 不可直接混接。</div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <footer class="statusbar">
      <span id="statusMessage" class="status-message">就绪：请扫描并选择串口</span>
      <span id="statusRight" class="status-right">Not Opened</span>
    </footer>
  </div>
  <div id="toast" class="toast"></div>

  <script>
const $ = (id) => document.getElementById(id);
const windowsHost = new URLSearchParams(window.location.search).get('host') === 'windows';
const hostPixelRatio = windowsHost ? Math.max(1, window.devicePixelRatio || 1) : 1;
const hostZoom = windowsHost ? Math.min(1, 2 / hostPixelRatio) : 1;
document.documentElement.style.setProperty('--host-zoom', String(hostZoom));
document.body.classList.toggle('windows-host', windowsHost);
    const state = {
      opened: false,
      ports: [],
      rxBytes: [],
      timer: null,
      eventSource: null,
      toastTimer: null,
      busy: false
    };
    const controlsToLock = ['portSelect', 'baudSelect', 'dataBits', 'stopBits', 'flowSelect', 'paritySelect', 'refreshPorts'];

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: options.body ? {'Content-Type': 'application/json', ...(options.headers || {})} : (options.headers || {})
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || `请求失败（${response.status}）`);
      return body;
    }

    function toast(message, error = false) {
      const el = $('toast');
      el.textContent = message;
      el.className = `toast show${error ? ' error' : ''}`;
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.className = 'toast', 3200);
    }

    function setStatus(message, type = '') {
      const el = $('statusMessage');
      el.textContent = message;
      el.className = `status-message ${type}`;
    }

    async function refreshPorts() {
      const previous = $('portSelect').value;
      try {
        const data = await api('/api/ports');
        state.ports = data.ports || [];
        const select = $('portSelect');
        select.innerHTML = '';
        if (!state.ports.length) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = '未检测到串口';
          select.appendChild(option);
        } else {
          for (const port of state.ports) {
            const option = document.createElement('option');
            option.value = port.device;
            option.textContent = `${port.device}  ·  ${port.group}`;
            select.appendChild(option);
          }
          if (state.ports.some(p => p.device === previous)) select.value = previous;
        }
        updatePortGroup();
        setStatus(`检测到 ${state.ports.length} 个可用串口`, 'ok');
      } catch (error) {
        setStatus(error.message, 'error');
        toast(error.message, true);
      }
    }

    function updatePortGroup() {
      const port = state.ports.find(p => p.device === $('portSelect').value);
      $('portGroupLabel').textContent = port ? port.group : '默认 115200 · 8N1';
    }

    function configFromUI() {
      return {
        device: $('portSelect').value,
        baud: Number($('baudSelect').value),
        dataBits: Number($('dataBits').value),
        stopBits: Number($('stopBits').value),
        parity: $('paritySelect').value,
        flow: $('flowSelect').value
      };
    }

    async function togglePort() {
      if (state.busy) return;
      state.busy = true;
      $('openButton').disabled = true;
      try {
        if (state.opened) {
          stopTimedSend();
          await api('/api/close', {method: 'POST'});
          setStatus('串口已关闭', 'ok');
        } else {
          const cfg = configFromUI();
          if (!cfg.device) throw new Error('没有可打开的串口，请重新扫描');
          await api('/api/open', {method: 'POST', body: JSON.stringify(cfg)});
          setStatus(`已打开 ${cfg.device}`, 'ok');
        }
        await refreshStatus();
      } catch (error) {
        setStatus(error.message, 'error');
        toast(error.message, true);
      } finally {
        state.busy = false;
        $('openButton').disabled = false;
      }
    }

    async function refreshStatus() {
      try {
        const status = await api('/api/status');
        state.opened = !!status.opened;
        $('txCount').textContent = Number(status.txCount || 0).toLocaleString('zh-CN');
        $('rxCount').textContent = Number(status.rxCount || 0).toLocaleString('zh-CN');
        for (const [name, active] of Object.entries(status.modem || {})) {
          const signal = document.querySelector(`[data-signal="${name}"]`);
          if (signal) signal.classList.toggle('active', !!active);
        }
        updateOpenState(status);
        if (status.lastError) setStatus(`串口错误：${status.lastError}`, 'error');
      } catch (error) {
        setStatus(`状态查询失败：${error.message}`, 'error');
      }
    }

    function updateOpenState(status) {
      const pill = $('connectionPill');
      pill.classList.toggle('online', state.opened);
      $('connectionText').textContent = state.opened ? `${status.config.device} 已连接` : '未连接';
      $('signalState').textContent = state.opened ? '实时更新' : '等待连接';
      const openButtonLabel = $('openButton').querySelector('span:last-child');
      if (openButtonLabel) openButtonLabel.textContent = state.opened ? '断开串口' : '连接串口';
      $('openButton').classList.toggle('close', state.opened);
      controlsToLock.forEach(id => $(id).disabled = state.opened);
      $('sendButton').disabled = !state.opened;
      $('testFrameButton').disabled = !state.opened;
      $('loopbackButton').disabled = !state.opened;
      const cfg = status.config || {};
      $('statusRight').textContent = windowsHost
        ? `YUCOM 1.2.0 · Windows${state.opened ? ` · ${cfg.device}` : ''}`
        : state.opened
          ? `${cfg.device}  ${cfg.baud},${cfg.parity === 'none' ? 'N' : cfg.parity === 'odd' ? 'O' : 'E'},${cfg.dataBits},${cfg.stopBits}`
          : 'Not Opened';
      if (!state.opened) stopTimedSend();
    }

    function connectEvents() {
      if (state.eventSource) state.eventSource.close();
      const source = new EventSource('/api/events');
      state.eventSource = source;
      source.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          if (message.type === 'data') appendBase64(message.data);
          else if (message.type === 'error') {
            setStatus(message.text, 'error');
            toast(message.text, true);
            refreshStatus();
          } else if (message.text) {
            setStatus(message.text, 'ok');
          }
        } catch (_) {}
      };
      source.onerror = () => setStatus('页面与本地串口服务连接中断，正在重连…', 'error');
      source.onopen = () => {
        if (!$('statusMessage').classList.contains('error')) return;
        setStatus('本地页面连接正常', 'ok');
      };
    }

    function appendBase64(base64) {
      const raw = atob(base64 || '');
      for (let i = 0; i < raw.length; i++) state.rxBytes.push(raw.charCodeAt(i));
      if (state.rxBytes.length > 300000) state.rxBytes.splice(0, state.rxBytes.length - 300000);
      if (!$('pauseDisplay').checked) renderReceive();
    }

    function renderReceive() {
      const view = $('receiveView');
      const bytes = new Uint8Array(state.rxBytes);
      if ($('rxHex').checked) {
        const lines = [];
        for (let i = 0; i < bytes.length; i += 16) {
          lines.push(Array.from(bytes.slice(i, i + 16), b => b.toString(16).padStart(2, '0').toUpperCase()).join(' '));
        }
        view.textContent = lines.join('\n');
      } else {
        view.textContent = new TextDecoder('utf-8', {fatal: false}).decode(bytes);
      }
      view.classList.toggle('empty', bytes.length === 0);
      view.classList.toggle('paused', $('pauseDisplay').checked);
      if ($('autoScroll').checked) view.scrollTop = view.scrollHeight;
      const encoding = $('rxHex').checked ? 'HEX' : 'UTF-8';
      const scrollState = $('autoScroll').checked ? '自动滚动开启' : '自动滚动关闭';
      const pauseState = $('pauseDisplay').checked ? ' · 显示已暂停' : '';
      $('receiveMeta').textContent = `${encoding} · ${scrollState}${pauseState}`;
    }

    async function sendCurrent() {
      if (!state.opened) {
        toast('请先打开串口', true);
        stopTimedSend();
        return false;
      }
      try {
        const result = await api('/api/send', {
          method: 'POST',
          body: JSON.stringify({
            data: $('sendEditor').value,
            format: $('txHex').checked ? 'hex' : 'text',
            newline: $('newlineSelect').value
          })
        });
        setStatus(`发送成功：${result.bytes} 字节`, 'ok');
        refreshStatus();
        return true;
      } catch (error) {
        setStatus(error.message, 'error');
        toast(error.message, true);
        stopTimedSend();
        return false;
      }
    }

    async function sendStandardFrame() {
      const stamp = new Date().toISOString().replace(/[-:.TZ]/g, '').slice(0, 14);
      const frame = `YUCOM_TEST_${stamp}_0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ`;
      try {
        const result = await api('/api/send', {
          method: 'POST',
          body: JSON.stringify({data: frame, format: 'text', newline: 'crlf'})
        });
        $('quickTestResult').className = 'test-result pass';
        $('quickTestResult').textContent = `已发送 ${result.bytes} 字节；请确认对端完整收到：${frame}`;
        setStatus(`标准测试帧已发送：${result.bytes}字节`, 'ok');
        toast('标准测试帧已发送');
        refreshStatus();
      } catch (error) {
        $('quickTestResult').className = 'test-result fail';
        $('quickTestResult').textContent = error.message;
        setStatus(error.message, 'error');
        toast(error.message, true);
      }
    }

    async function runLoopbackTest() {
      if (!state.opened) return toast('请先打开串口', true);
      const confirmed = confirm(
        '硬件回环自检会立即发送512字节原始数据。\n\n' +
        '请先确认：\n' +
        '• 已按照当前接口电气标准正确连接发送端和接收端；\n' +
        '• 没有把RS232、TTL、RS422或RS485不同电平互相短接；\n' +
        '• 外部设备允许接收测试数据。\n\n' +
        '确认开始回环自检吗？'
      );
      if (!confirmed) return;
      const button = $('loopbackButton');
      button.disabled = true;
      button.innerHTML = '正在测试…<span>最长等待2秒</span>';
      $('quickTestResult').className = 'test-result';
      $('quickTestResult').textContent = '正在发送并核对回环数据…';
      try {
        const result = await api('/api/loopback-test', {
          method: 'POST',
          body: JSON.stringify({payloadLength: 512, timeoutMs: 2000})
        });
        $('quickTestResult').className = `test-result ${result.passed ? 'pass' : 'fail'}`;
        $('quickTestResult').textContent = `${result.passed ? '通过' : '未通过'}：${result.message}；发送${result.sentBytes}字节，测试期间收到${result.receivedBytes}字节，耗时${result.elapsedMs}ms。`;
        setStatus(`回环自检${result.passed ? '通过' : '未通过'}`, result.passed ? 'ok' : 'error');
        toast(`回环自检${result.passed ? '通过' : '未通过'}`, !result.passed);
        refreshStatus();
      } catch (error) {
        $('quickTestResult').className = 'test-result fail';
        $('quickTestResult').textContent = error.message;
        setStatus(error.message, 'error');
        toast(error.message, true);
      } finally {
        button.innerHTML = '硬件回环自检<span>TX→RX核对</span>';
        button.disabled = !state.opened;
      }
    }

    function startTimedSend() {
      stopTimedSend(false);
      if (!$('timedSend').checked) return;
      const interval = Number($('intervalMs').value);
      if (!Number.isFinite(interval) || interval < 50) {
        $('timedSend').checked = false;
        toast('定时发送间隔不能小于50ms', true);
        return;
      }
      state.timer = setInterval(sendCurrent, interval);
      setStatus(`定时发送已启动：${interval}ms/次`, 'ok');
    }

    function stopTimedSend(clearCheck = true) {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      if (clearCheck) $('timedSend').checked = false;
    }

    async function shutdownApp() {
      if (!confirm('退出将关闭当前串口并停止本地页面，确定退出吗？')) return;
      stopTimedSend();
      try { await api('/api/shutdown', {method: 'POST'}); } catch (_) {}
      if (windowsHost && typeof window.yucomWindowClose === 'function') {
        try { await window.yucomWindowClose(); } catch (_) {}
      } else {
        document.body.innerHTML = '<div style="font:18px sans-serif;padding:40px;color:#17683f">YUCOM 已安全退出，可以关闭本页面。</div>';
      }
    }

    $('refreshPorts').addEventListener('click', refreshPorts);
    $('portSelect').addEventListener('change', updatePortGroup);
    $('openButton').addEventListener('click', togglePort);
    $('sendButton').addEventListener('click', sendCurrent);
    $('clearReceive').addEventListener('click', () => { state.rxBytes = []; renderReceive(); });
    $('clearSend').addEventListener('click', () => $('sendEditor').value = '');
    $('rxHex').addEventListener('change', renderReceive);
    $('autoScroll').addEventListener('change', renderReceive);
    $('pauseDisplay').addEventListener('change', renderReceive);
    $('resetCounters').addEventListener('click', async () => { await api('/api/reset-counters', {method: 'POST'}); refreshStatus(); });
    $('timedSend').addEventListener('change', () => $('timedSend').checked ? startTimedSend() : stopTimedSend());
    $('intervalMs').addEventListener('change', () => { if ($('timedSend').checked) startTimedSend(); });
    $('exitButton').addEventListener('click', shutdownApp);
    if (windowsHost) {
      $('windowMinimize').addEventListener('click', () => window.yucomWindowMinimize?.());
      $('windowMaximize').addEventListener('click', () => window.yucomWindowToggleMaximize?.());
      $('windowClose').addEventListener('click', shutdownApp);
      document.querySelector('.topbar').addEventListener('mousedown', (event) => {
        if (event.button !== 0 || event.target.closest('button, input, select, .connection-pill')) return;
        window.yucomWindowDrag?.();
      });
      document.querySelector('.topbar').addEventListener('dblclick', (event) => {
        if (event.target.closest('button, input, select, .connection-pill')) return;
        window.yucomWindowToggleMaximize?.();
      });
    }
    $('aboutButton').addEventListener('click', () => alert(
      'YUCOM 使用提示\n\n' +
      '1. 默认参数为115200、8N1、无流控。\n' +
      '2. 支持板载、USB、PCIe及多串口扩展设备。\n' +
      '3. HEX发送示例：“55 AA 01 02”，也可输入“0x55 0xAA”。\n' +
      '4. 标准测试帧用于配合对端设备检查收发。\n' +
      '5. 回环自检前必须按接口标准正确连接TX与RX。\n' +
      '6. 改接线前，请关闭串口并给设备断电。'
    ));
    $('testFrameButton').addEventListener('click', sendStandardFrame);
    $('loopbackButton').addEventListener('click', runLoopbackTest);
    window.addEventListener('beforeunload', () => stopTimedSend());

    connectEvents();
    refreshPorts();
    refreshStatus();
    setInterval(refreshStatus, 700);
  </script>
</body>
</html>
