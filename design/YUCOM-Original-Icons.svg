  </g>

  <g transform="translate(748 132)">
    <rect width="112" height="112" rx="28" fill="#FFFFFF" stroke="#D8E1EE"/>
    <circle cx="56" cy="56" r="26" fill="#EFF6FF"/>
    <path d="M46 49v8h20v-8M51 49v-8M61 49v-8M56 57v16" fill="none" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
