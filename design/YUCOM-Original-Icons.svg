  </g>

  <g transform="translate(412 132)">
    <rect width="112" height="112" rx="28" fill="#FFFFFF" stroke="#D8E1EE"/>
    <circle cx="56" cy="56" r="26" fill="#EFF6FF"/>
    <path d="M56 73V51M47 58l9-9 9 9M43 42h26" fill="none" stroke="#2563EB" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="144" class="ui name">发送</text>
  </g>

  <g transform="translate(580 132)">
    <rect width="112" height="112" rx="28" fill="#FFFFFF" stroke="#D8E1EE"/>
    <circle cx="56" cy="56" r="26" fill="#F5F3FF"/>
    <path d="M43 47a18 18 0 0 1 26-5M69 42v10H59M69 65a18 18 0 0 1-26 5M43 70V60h10" fill="none" stroke="#4F46E5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
