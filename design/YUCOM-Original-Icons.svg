<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <style>
      .ui { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .name { font-size: 15px; font-weight: 650; fill: #172033; text-anchor: middle; }
      .note { font-size: 13px; fill: #64748B; }
    </style>
  </defs>
  <rect width="960" height="480" rx="24" fill="#F8FAFC"/>
  <text x="48" y="58" class="ui" font-size="24" font-weight="700" fill="#0F172A">YUCOM 原创矢量图标</text>
  <text x="48" y="86" class="ui note">原创串行通信标记，轻度融入飞檐轮廓 · 无外部图标库、品牌素材或网络素材</text>

  <g transform="translate(76 132)">
