    <path d="M24 37c12 0 20-6 32-16 12 10 20 16 32 16M20 43h72" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <circle cx="28" cy="56" r="3.5" fill="#FFFFFF"/><circle cx="84" cy="56" r="3.5" fill="#FFFFFF"/>
    <circle cx="28" cy="70" r="3.5" fill="#FFFFFF"/><circle cx="84" cy="70" r="3.5" fill="#FFFFFF"/>
    <circle cx="28" cy="84" r="3.5" fill="#FFFFFF"/><circle cx="84" cy="84" r="3.5" fill="#FFFFFF"/>
    <path d="M35 56h9c8 0 8 11 16 11h17M35 70h42M35 84h9c8 0 8-11 16-11h17" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="56" y="144" class="ui name">串行飞檐标记</text>
  </g>

  <g transform="translate(244 132)">
    <rect width="112" height="112" rx="28" fill="#FFFFFF" stroke="#D8E1EE"/>
    <circle cx="56" cy="56" r="26" fill="#ECFDF5"/>
    <path d="M56 39v22M47 54l9 9 9-9M43 70h26" fill="none" stroke="#16A34A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
