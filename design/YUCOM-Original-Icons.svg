  <rect x="48" y="336" width="864" height="96" rx="16" fill="#FFFFFF" stroke="#D8E1EE"/>
  <circle cx="82" cy="368" r="6" fill="#2563EB"/><text x="100" y="373" class="ui note">主体是三路串行数据通道；顶部只保留轻量飞檐曲线，古楼意象不抢功能识别。</text>
  <circle cx="82" cy="400" r="6" fill="#16A34A"/><text x="100" y="405" class="ui note">蓝色表示发送/操作，绿色表示接收/正常状态，橙色表示待连接。</text>
